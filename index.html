<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende idiomas a tu ritmo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 20px;
      line-height: 1.6;
      background: #f7f7f2;
      color: #222;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 { color: #2b5d7a; }
    button {
      font-size: 20px;
      padding: 14px 28px;
      background: #2b5d7a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #1f4660; }
  </style>
</head>
<body>
  <h1>Aprende idiomas a tu ritmo</h1>
  <p>Una app que se adapta a ti.</p>
  <button>Empezar</button>
</body>
</html>
