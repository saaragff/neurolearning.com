<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Personalizar diseño</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; background: #fff; color: #222; }
    .layout { display: flex; min-height: 100vh; flex-wrap: wrap; }
    .panel { width: 340px; padding: 20px; background: #f0f0f0; overflow-y: auto; }
    .vista { flex: 1; min-width: 300px; }
    iframe { width: 100%; height: 100vh; border: 0; background: white; }
    h1 { font-size: 1.3rem; margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input[type="color"] { width: 100%; height: 40px; border: 1px solid #999; }
    input[type="text"], select, textarea { width: 100%; padding: 8px; font-size: 1rem; }
    input[type="range"] { width: 100%; }
    textarea { height: 220px; font-family: monospace; font-size: 0.8rem; }
    button { margin-top: 12px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    small { color: #555; display: block; margin-top: 4px; }
    @media (max-width: 700px) { .panel { width: 100%; } iframe { height: 70vh; } }
  </style>
</head>
<body>
<div class="layout">

  <div class="panel">
    <h1>Personalizar diseño</h1>

    <label for="principal">Color principal</label>
    <input type="color" id="principal" value="#2b5d7a">

    <label for="fondo">Color de fondo</label>
    <input type="color" id="fondo" value="#f7f7f2">

    <label for="texto">Color del texto</label>
    <input type="color" id="texto" value="#222222">

    <label for="fuente">Tipografía</label>
    <select id="fuente">
      <option value="Arial, Helvetica, sans-serif">Arial</option>
      <option value="Verdana, Geneva, sans-serif">Verdana</option>
      <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
      <option value="Tahoma, sans-serif">Tahoma</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Comic Sans MS', 'Comic Sans', cursive">Comic Sans</option>
      <option value="'Courier New', monospace">Courier New</option>
    </select>

    <label for="tamano">Tamaño de letra: <span id="tamanoValor">20</span> px</label>
    <input type="range" id="tamano" min="16" max="30" value="20">

    <label for="imagen">Imagen de fondo (nombre del archivo)</label>
    <input type="text" id="imagen" placeholder="fondo.jpg">
    <small>Sube antes la imagen a tu repositorio y escribe aquí su nombre. O elige un archivo de tu ordenador para verlo (solo vista previa):</small>
    <input type="file" id="archivo" accept="image/*">

    <label for="capa">Capa clara sobre la imagen: <span id="capaValor">70</span>%</label>
    <input type="range" id="capa" min="0" max="95" value="70">
    <small>Súbela si el texto cuesta de leer sobre la imagen.</small>

    <button id="quitarImagen" type="button">Quitar imagen</button>
    <button id="restablecer" type="button">Restablecer todo</button>

    <label for="salida">Código resultante</label>
    <textarea id="salida" readonly></textarea>
    <button id="copiar" type="button">Copiar código</button>
    <small id="mensaje"></small>
  </div>

  <div class="vista">
    <iframe id="vista" src="index.html" title="Vista previa de la web"></iframe>
  </div>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const marco = $('vista');
  let urlLocal = null;
  let nombreLocal = null;

  function hexARgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbAHex(r, g, b) {
    return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  }
  function mezclar(h1, h2, t) {
    const a = hexARgb(h1), b = hexARgb(h2);
    return rgbAHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
  }

  function generar(paraVistaPrevia) {
    const principal = $('principal').value;
    const fondo = $('fondo').value;
    const texto = $('texto').value;
    const fuente = $('fuente').value;
    const tamano = $('tamano').value;
    const capa = Number($('capa').value) / 100;
    const nombre = $('imagen').value.trim();
    const [r, g, b] = hexARgb(fondo);

    let css = ':root {\n' +
      '  --fondo: ' + fondo + ';\n' +
      '  --texto: ' + texto + ';\n' +
      '  --principal: ' + principal + ';\n' +
      '  --principal-oscuro: ' + mezclar(principal, '#000000', 0.25) + ';\n' +
      '  --suave: ' + mezclar(principal, '#ffffff', 0.88) + ';\n' +
      '}\n' +
      'body {\n' +
      '  font-family: ' + fuente + ';\n' +
      '  font-size: ' + tamano + 'px;\n';

    if (nombre) {
      let ruta = nombre;
      if (paraVistaPrevia && urlLocal && nombre === nombreLocal) ruta = urlLocal;
      css += '  background-image: linear-gradient(rgba(' + r + ',' + g + ',' + b + ',' + capa + '), rgba(' + r + ',' + g + ',' + b + ',' + capa + ')), url("' + ruta + '");\n' +
             '  background-size: cover;\n' +
             '  background-position: center;\n' +
             '  background-attachment: fixed;\n';
    }
    css += '}\n';
    return css;
  }

  function actualizar() {
    $('tamanoValor').textContent = $('tamano').value;
    $('capaValor').textContent = $('capa').value;
    $('salida').value = '/* tema.css */\n' + generar(false);

    try {
      const doc = marco.contentDocument;
      if (!doc) return;
      let estilo = doc.getElementById('tema-previa');
      if (!estilo) {
        estilo = doc.createElement('style');
        estilo.id = 'tema-previa';
        doc.head.appendChild(estilo);
      }
      estilo.textContent = generar(true);
    } catch (e) {}
  }

  ['principal', 'fondo', 'texto', 'fuente', 'tamano', 'capa', 'imagen'].forEach(id => {
    $(id).addEventListener('input', actualizar);
  });
  marco.addEventListener('load', actualizar);

  $('archivo').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (urlLocal) URL.revokeObjectURL(urlLocal);
    urlLocal = URL.createObjectURL(f);
    nombreLocal = f.name.replace(/\s+/g, '-').toLowerCase();
    $('imagen').value = nombreLocal;
    $('mensaje').textContent = 'Recuerda subir "' + nombreLocal + '" a tu repositorio de GitHub.';
    actualizar();
  });

  $('quitarImagen').addEventListener('click', () => {
    $('imagen').value = '';
    $('archivo').value = '';
    urlLocal = null;
    nombreLocal = null;
    actualizar();
  });

  $('restablecer').addEventListener('click', () => {
    $('principal').value = '#2b5d7a';
    $('fondo').value = '#f7f7f2';
    $('texto').value = '#222222';
    $('fuente').selectedIndex = 0;
    $('tamano').value = 20;
    $('capa').value = 70;
    $('quitarImagen').click();
  });

  $('copiar').addEventListener('click', () => {
    $('salida').select();
    navigator.clipboard.writeText($('salida').value).then(
      () => { $('mensaje').textContent = 'Código copiado. Pégalo en tema.css.'; },
      () => { $('mensaje').textContent = 'Selecciona el texto y cópialo con Ctrl+C.'; }
    );
  });

  actualizar();
</script>
</body>
</html>
